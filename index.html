<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Pirate</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main>
      <h1>Whack-a-Pirate 🏴‍☠️</h1>

      <div class="info">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="time-box">Time: <span id="time">30</span></div>
        <div class="lives-box">❤️❤️❤️</div>
      </div>

      <div class="buttons">
        <button id="start-game">Start</button>
        <button id="how-to-play">Help</button>
      </div>

      <div class="board"></div>

      <div id="select-character">
        <h2>Choose your Character</h2>

        <div class="characters">
          <button class="crew">
            <img src="./imges/luffy-img.jpeg" alt="Luffy-img" />
            <p>Luffy</p>
          </button>
        </div>

        <div class="characters">
          <button class="crew">
            <img src="./imges/zoro-img.jpeg" alt="Zoro-img" />
            <p>Zoro</p>
          </button>
        </div>

        <div class="characters">
          <button class="crew">
            <img src="./imges/sanji-img.jpeg" alt="Sanji-img" />
            <p>Sanji</p>
          </button>
        </div>

        <div class="characters">
          <button class="crew">
            <img src="./imges/nami-img.jpeg" alt="Nami-img" />
            <p>Nami</p>
          </button>
        </div>

        <div class="characters">
          <button class="crew">
            <img src="./imges/robin-img.jpeg" alt="Robin-img" />
            <p>Robin</p>
          </button>
        </div>

        <!-- <div class="characters">
          <button class="crew">
            <img src="" alt="Chopper-img" />
            <p>Chopper</p>
          </button>
        </div> -->
      </div>
    </main>
  </body>
</html>
